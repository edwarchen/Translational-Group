[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tcreval"
version = "1.0.0"
description = "TCR/BCR multiplex PCR primer coverage evaluation toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pandas>=1.3",
    "openpyxl>=3.0",
]

[project.scripts]
tcreval = "tcreval.cli:main"

[project.urls]
Repository = "https://github.com/edwarchen/TCR_Evaluation"

[tool.setuptools.packages.find]
include = ["tcreval*"]
